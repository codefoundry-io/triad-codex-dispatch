# Formal Gemini review is a read/search-only, non-interactive Plan Mode route.
# CLI --policy replaces configured user policy paths for this invocation. Admin
# policy remains a higher tier and is not bypassed by this packaged user policy.

[[rule]]
toolName = [
  "read_file",
  "read_many_files",
  "list_directory",
  "glob",
  "grep_search",
  "google_web_search",
  "web_fetch",
  "get_internal_docs",
]
decision = "allow"
priority = 999

[[rule]]
toolName = [
  "write_file",
  "replace",
  "run_shell_command",
  "enter_plan_mode",
  "exit_plan_mode",
]
decision = "deny"
priority = 999
denyMessage = "Formal TRIAD review permits only the packaged read/search tool set."

[[rule]]
toolName = "*"
decision = "deny"
priority = 998
denyMessage = "Formal TRIAD review denies every tool outside the packaged read/search set."
